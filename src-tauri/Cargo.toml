[package]
name = "lorekeeper"
version = "0.6.0"
description = "Quick D&D session notes from a hotkey"
authors = ["Yonatan Karp-Rudin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lorekeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
enigo = "0.6.1"
chrono = "0.4.45"
tauri-plugin-dialog = "2"
ureq = { version = "3", features = ["json"] }
keyring = "4"
sha1_smol = "1"
ring = "0.17"
base64 = "0.23"
tauri-plugin-updater = "2"
trash = "5.2.9"
# Shared campaigns (sync.rs): the protocol crate, and a WebSocket client on Tauri's tokio runtime with rustls and
# ring, the same TLS as ureq (no OpenSSL).
sync-protocol = { path = "../sync-protocol" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
zeroize = "1"

[dev-dependencies]
# The sync engine's end-to-end test runs the real server in-process.
sync-server = { path = "../sync-server" }
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Sync's crypto and encoding at full speed in debug builds and tests too: unoptimized, a 20 MB portrait takes seconds.
[profile.dev.package]
chacha20 = { opt-level = 3 }
poly1305 = { opt-level = 3 }
blake3 = { opt-level = 3 }
data-encoding = { opt-level = 3 }
serde_json = { opt-level = 3 }
tungstenite = { opt-level = 3 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# glib 0.18.5 with the RUSTSEC-2024-0429 fix backported (Linux only); see patches/README.md.
[patch.crates-io]
glib = { path = "patches/glib-0.18.5" }

# Returning focus to the app the quick-note box was opened over.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }

# O_NOFOLLOW when sync reads files to upload.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
