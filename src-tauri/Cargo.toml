[package]
name = "lorekeeper"
version = "0.3.0"
description = "Quick D&D session notes from a hotkey"
authors = ["Yonatan Karp-Rudin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lorekeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
enigo = "0.6.1"
chrono = "0.4.45"
tauri-plugin-dialog = "2"
ureq = { version = "3", features = ["json"] }
keyring = "4"
sha1_smol = "1"
base64 = "0.22"
tauri-plugin-updater = "2"
trash = "5.2.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# glib 0.18.5 with the RUSTSEC-2024-0429 fix backported (Linux only); see patches/README.md.
[patch.crates-io]
glib = { path = "patches/glib-0.18.5" }
