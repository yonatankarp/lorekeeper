[package]
name = "sync-protocol"
version = "0.1.0"
edition = "2021"
description = "Lorekeeper sync: ids, encryption, invite links and the server's message types (see docs/SYNC.md)"
publish = false

[dependencies]
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
data-encoding = "2.11.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
