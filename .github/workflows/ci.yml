name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libxkbcommon-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Windows-only code (focus handling, installer) is otherwise first compiled at release time.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # Approves minor/patch Dependabot PRs and arms auto-merge; the main ruleset requires test and windows.
  # Not for the sync server's crates or image: those checks don't gate it, and a merge publishes an image
  # golem deploys, so they wait for a person (Dependabot's branch names carry the directory).
  dependabot_auto_merge:
    needs: [test, windows]
    if: >-
      ${{ github.actor == 'dependabot[bot]'
      && !startsWith(github.head_ref, 'dependabot/cargo/sync')
      && !startsWith(github.head_ref, 'dependabot/docker/') }}
    permissions:
      contents: read
      pull-requests: write
    uses: yonatankarp/github-actions/.github/workflows/dependabot-auto-merge.yml@v2
    secrets:
      GITHUB_PAT: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
