name: Sync server

# Tests sync-protocol and sync-server; on main, publishes ghcr.io/yonatankarp/lorekeeper-sync
# (tags sha-<short sha> and latest). See docs/SYNC.md.
on:
  push:
    branches: [main]
    paths:
      - "sync-protocol/**"
      - "sync-server/**"
      - ".github/workflows/sync-server.yml"
  pull_request:
    paths:
      - "sync-protocol/**"
      - "sync-server/**"
      - ".github/workflows/sync-server.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sync-protocol
            sync-server
      - run: cargo test --locked --manifest-path sync-protocol/Cargo.toml
      - run: cargo clippy --locked --manifest-path sync-protocol/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path sync-server/Cargo.toml
      - run: cargo clippy --locked --manifest-path sync-server/Cargo.toml --all-targets -- -D warnings

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sync-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yonatankarp/lorekeeper-sync:sha-${{ steps.sha.outputs.short }}
            ghcr.io/yonatankarp/lorekeeper-sync:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
