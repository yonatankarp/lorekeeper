name: Release

# Push a tag like v0.2.0 (matching "version" in src-tauri/tauri.conf.json) to build installers
# for macOS, Windows and Linux and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read # the release notes are written from the pull requests

# The platforms build in parallel between two one-off jobs: `draft` makes the one draft release first (left to the
# builds, each made its own: v0.7.0 had two), and `updater` writes latest.json last (each build rewrote it, dropping
# the others' platforms).
jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes list the pull requests since the previous v* tag
      - id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-v$version}" >> "$GITHUB_OUTPUT"
      # The pull requests merged since the last version, by the kind in their titles, then the fixed text in
      # .github/release-footer.md. A version with no feat, fix or change fails here, before any draft exists.
      # The update dialog shows the start of the notes (about 400 characters), which is the changes.
      # `ref` is this commit, so a manual run on main (no tag yet) works too.
      - id: notes
        uses: yonatankarp/github-actions/.github/actions/release-notes@v2
        with:
          version: ${{ steps.version.outputs.tag }}
          ref: ${{ github.sha }}
          override: release-notes/{version}.md
          footer: .github/release-footer.md
      # A re-run reuses the draft for the tag, notes and all.
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="Lorekeeper $VERSION" -F body=@"$NOTES" -F draft=true -q .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # One download per OS. "app" is needed on macOS for the updater's .app.tar.gz; the setup .exe
          # and the .AppImage are updated in place. createUpdaterArtifacts adds the signed copies.
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles appimage
    runs-on: ${{ matrix.platform }}
    env:
      # Windows code signing (docs/DEVELOPMENT.md) is on only once the ESIGNER_* secrets exist.
      WINDOWS_SIGNING: ${{ secrets.ESIGNER_CREDENTIAL_ID != '' }}
      # macOS signing with our own certificate (docs/DEVELOPMENT.md) is on once the MACOS_CERTIFICATE secrets exist.
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libxkbcommon-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # A stable signature, so the macOS keychain knows each new version is the same app and stops asking for its
      # passwords after every update. Tauri only takes Apple-issued certificates from APPLE_CERTIFICATE, so the
      # certificate goes into a keychain here and Tauri gets just the name (APPLE_SIGNING_IDENTITY).
      - name: macOS code signing
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_password" "$kc" > /dev/null
          read -ra keychains <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$kc" "${keychains[@]}"
          echo "APPLE_SIGNING_IDENTITY=Lorekeeper Code Signing" >> "$GITHUB_ENV"
      # Tauri runs this signCommand on the app exe, the NSIS plugins, the uninstaller and the installer
      # while bundling, so the update .sig is made from the signed installer. Passwords stay in env
      # (jsign's "env:"), never in the config or on a command line.
      - name: Windows code signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: bash
        env:
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
        run: |
          jar="$RUNNER_TEMP/jsign.jar"
          curl -fsSL -o "$jar" https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar
          echo "602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c  $jar" | sha256sum -c
          conf="$(cygpath -m "$RUNNER_TEMP/windows-sign.json")"
          cat > "$conf" <<EOF
          {"bundle":{"windows":{"signCommand":{"cmd":"java","args":["-jar","$(cygpath -m "$jar")",
            "--storetype","ESIGNER","--alias","$ESIGNER_CREDENTIAL_ID",
            "--storepass","env:ESIGNER_STOREPASS","--keypass","env:ESIGNER_TOTP_SECRET",
            "--tsaurl","http://ts.ssl.com","--tsmode","RFC3161","%1"]}}}}
          EOF
          echo "SIGN_ARGS=--config $conf" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files (.sig) that the app checks against plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into the app (see src-tauri/src/cloud.rs); kept out of the source.
          LOREKEEPER_GOOGLE_CLIENT_SECRET: ${{ secrets.LOREKEEPER_GOOGLE_CLIENT_SECRET }}
          # Read by jsign during Windows code signing; unused otherwise.
          ESIGNER_STOREPASS: ${{ secrets.ESIGNER_USERNAME }}|${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          uploadUpdaterJson: false # the updater job writes it once every platform is up
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }}

  updater:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/latest-json.mjs "$GITHUB_REPOSITORY" "${{ needs.draft.outputs.id }}" --upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
