# Weekly dependency update PRs, grouped so each ecosystem is one PR.
# Security fixes come separately, as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["tauri*"]
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  # The sync server and its protocol crate (docs/SYNC.md); the app will share sync-protocol.
  - package-ecosystem: cargo
    directories: [/sync-protocol, /sync-server]
    schedule:
      interval: weekly
    groups:
      sync:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /sync-server
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  # Build tools only; nothing from node_modules ships. After a marked or
  # @codemirror/* update, run `pnpm vendor` and commit src/vendor.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
