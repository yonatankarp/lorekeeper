<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quick Note</title>
    <style>
      /* Tome (light) by default; Dungeon for OS dark mode under System, or when Settings forces dark (keep both copies
         identical, theme.test.js checks). Parchment or stone, book type and a fine inner frame, as in styles.css. */
      @font-face { font-family: "Bookinsanity"; src: url("fonts/bookinsanity-regular.woff2") format("woff2"); font-display: swap; }
      :root { color-scheme: light; font-synthesis: none; --bg: #f8f0dc; --fg: #2b1d12; --muted: #5c4632; --ghost: #8a7052; --frame: #b99a6a; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme]) { color-scheme: dark; --bg: #27241f; --fg: #eadcbf; --muted: #b3a284; --ghost: #85765f; --frame: #6b5a3e; } }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #27241f; --fg: #eadcbf; --muted: #b3a284; --ghost: #85765f; --frame: #6b5a3e; }
      body { box-shadow: inset 0 0 0 1px var(--frame), inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--frame); }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
      /* The ghost sits behind the input with the same box, so its text lines up with what's typed. */
      input, #ghost {
        box-sizing: border-box; width: 100%; height: 100%; padding: 0 18px;
        font: 19px "Bookinsanity", "Bookman Old Style", "Iowan Old Style", Georgia, serif;
      }
      input { position: relative; border: 0; outline: 0; background: transparent; color: var(--fg); }
      input::placeholder { color: var(--muted); }
      #ghost { position: absolute; inset: 0; display: flex; align-items: center; white-space: pre; overflow: hidden; color: transparent; }
      #rest { color: var(--ghost); }
      /* "Start Session N?" under the note when the session has gone quiet; the note row shrinks to make room. */
      #stale { display: none; position: absolute; left: 18px; right: 18px; bottom: 8px; font: 13px "Bookinsanity", Georgia, serif; color: var(--muted); }
      body.stale #stale { display: block; }
      body.stale input, body.stale #ghost { height: 40px; }
    </style>
  </head>
  <body>
    <div id="ghost" aria-hidden="true"><span id="typed"></span><span id="rest"></span></div>
    <input id="note" aria-label="Session note" aria-describedby="stale" autocomplete="off" spellcheck="true" autofocus
           placeholder='Note…   @npc  #loot  !quest  ?mystery  "quote' />
    <div id="stale"></div>
    <script type="module" src="capture.js"></script>
  </body>
</html>
