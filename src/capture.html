<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quick Note</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --muted: #8a8a8e; --ghost: #a8a8ad; }
      /* Same dark values twice: OS dark mode (unless Settings forces light), and Settings forcing dark. */
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #232326; --fg: #f2f2f4; --muted: #8d8d93; --ghost: #6e6e74; } }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #232326; --fg: #f2f2f4; --muted: #8d8d93; --ghost: #6e6e74; }
      :root[data-theme="light"] { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
      /* The ghost sits behind the input with the same box, so its text lines up with what's typed. */
      input, #ghost {
        box-sizing: border-box; width: 100%; height: 100%; padding: 0 18px;
        font: 20px -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      input { position: relative; border: 0; outline: 0; background: transparent; color: var(--fg); }
      input::placeholder { color: var(--muted); }
      #ghost { position: absolute; inset: 0; display: flex; align-items: center; white-space: pre; overflow: hidden; color: transparent; }
      #rest { color: var(--ghost); }
    </style>
  </head>
  <body>
    <div id="ghost" aria-hidden="true"><span id="typed"></span><span id="rest"></span></div>
    <input id="note" aria-label="Session note" autocomplete="off" spellcheck="true" autofocus
           placeholder='Note…   @npc  #loot  !quest  ?mystery  "quote' />
    <script type="module" src="capture.js"></script>
  </body>
</html>
